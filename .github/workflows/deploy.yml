name: Deploy Auth API
on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: self-hosted 
    steps:
      - name: fecth
        uses: actions/checkout@v4

      - name: sync
        run: |
          rsync -av --delete ./ ~/server/bastion/

      - name: build and restart
        run: |
          cd ~/server
          docker compose up -d --build bastion

      - name: clean up
        run: docker image prune -f